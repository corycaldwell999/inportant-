version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tip_db}
      POSTGRES_USER: ${POSTGRES_USER:-tip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tip_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tip_user} -d ${POSTGRES_DB:-tip_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tip-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tip-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tip-network

volumes:
  postgres_data:
  redis_data:

networks:
  tip-network:
    driver: bridge

